# Production stack for one VPS: Caddy (HTTPS) -> api, Postgres, Redis. See docs/DEPLOY.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: techdropout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: techdropout
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  api:
    build: ./backend
    restart: unless-stopped
    depends_on: [db, redis]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://techdropout:${POSTGRES_PASSWORD}@db:5432/techdropout
      UPLOAD_DIR: /data/uploads
      # big video uploads land here first, on the same disk, so moving them is instant
      UPLOAD_TMP_DIR: /data/uploads/tmp
    volumes: [uploads:/data/uploads]
    ports: ["127.0.0.1:3000:3000"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
volumes:
  caddy_data:
  pgdata:
  uploads:
